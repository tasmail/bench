name: Nginx generation contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-generation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Native generator regeneration and configuration validation
        run: python -m unittest -v bench.tests.test_nginx_includes
